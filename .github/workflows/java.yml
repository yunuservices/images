name: build java images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "java/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo curl -sSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: ShellCheck
        # Only fail on real errors; style/warning notes stay advisory.
        run: shellcheck --severity=error java/rootfs/entrypoint.sh java/rootfs/usr/local/lib/entrypoint/*.sh java/build/*.sh java/test/*.sh

      - name: Hadolint
        # Fail on warnings and errors, ignore info/style suggestions.
        run: hadolint --failure-threshold warning java/Dockerfile

  matrix:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}                   # build legs (arch included)
      matrix_images: ${{ steps.set-matrix.outputs.matrix_images }}     # merge legs (image only)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve images from versions.json
        id: set-matrix
        run: |
          IMAGES=$(jq -c '[to_entries[] | .key as $vendor | .value | to_entries[]
            | {vendor: $vendor, version: .key, base: .value}]' java/versions.json)
          MATRIX=$(printf '%s' "$IMAGES" | jq -c '[.[] | (. + {arch: "amd64", runner: "ubuntu-24.04"}),
            (. + {arch: "arm64", runner: "ubuntu-24.04-arm"})]')
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "matrix_images={\"include\":$(printf '%s' "$IMAGES" | jq -c 'map(del(.base))')}" >> "$GITHUB_OUTPUT"

  allocators:
    name: "allocators (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build allocators
        uses: docker/build-push-action@v7
        with:
          context: ./java
          file: ./java/Dockerfile
          target: allocators
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=allocators-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=allocators-${{ matrix.arch }}
          outputs: type=local,dest=allocators

      - name: Upload allocators
        uses: actions/upload-artifact@v7
        with:
          name: allocators-${{ matrix.arch }}
          path: allocators/*
          if-no-files-found: error
          retention-days: 1

  build:
    name: "${{ matrix.vendor }}_${{ matrix.version }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    needs: [matrix, allocators]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download allocators
        uses: actions/download-artifact@v8
        with:
          name: allocators-${{ matrix.arch }}
          path: allocators

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: ./java
          file: ./java/Dockerfile
          build-args: BASE_IMAGE=${{ matrix.base }}
          build-contexts: allocators=./allocators
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: images:smoke
          cache-from: type=gha,scope=${{ matrix.vendor }}-${{ matrix.version }}-${{ matrix.arch }}

      - name: Smoke test
        run: docker run --rm -i --entrypoint /bin/sh images:smoke -s < java/test/smoke.sh

      - name: Scan for vulnerabilities
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: images:smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: "0"

      - name: Publish vulnerability report
        if: matrix.arch == 'amd64'
        run: |
          {
            echo "### Trivy: ${{ matrix.vendor }}_${{ matrix.version }}"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./java
          file: ./java/Dockerfile
          build-args: BASE_IMAGE=${{ matrix.base }}
          build-contexts: allocators=./allocators
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.vendor }}-${{ matrix.version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.vendor }}-${{ matrix.version }}-${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/images,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.vendor }}-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "merge ${{ matrix.vendor }}_${{ matrix.version }}"
    runs-on: ubuntu-24.04
    needs: [matrix, build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix_images) }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.vendor }}-${{ matrix.version }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t \
            ghcr.io/${{ github.repository_owner }}/images:${{ matrix.vendor }}_${{ matrix.version }} \
            $(printf 'ghcr.io/${{ github.repository_owner }}/images@sha256:%s ' *)
