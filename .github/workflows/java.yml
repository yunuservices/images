name: build java images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "java/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - ".github/workflows/java.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo curl -sSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: ShellCheck
        # Only fail on real errors; style/warning notes stay advisory.
        run: shellcheck --severity=error java/entrypoint.sh java/build/*.sh

      - name: Hadolint
        # Fail on warnings and errors, ignore info/style suggestions.
        run: |
          find java -mindepth 4 -maxdepth 4 -name Dockerfile -type f -print0 \
            | xargs -0 -n1 hadolint --failure-threshold warning

  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve images from Dockerfiles
        id: set-matrix
        run: |
          MATRIX=$(find java -mindepth 4 -maxdepth 4 -name Dockerfile -type f \
            | sort \
            | sed -E 's#java/vendors/([^/]+)/([^/]+)/Dockerfile#{"vendor":"\1","version":"\2"}#' \
            | paste -sd, -)
          echo "matrix={\"include\":[${MATRIX}]}" >> "$GITHUB_OUTPUT"

  build:
    name: "${{ matrix.vendor }}_${{ matrix.version }}"
    runs-on: ubuntu-latest
    needs: matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./java
          file: ./java/vendors/${{ matrix.vendor }}/${{ matrix.version }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/images:${{ matrix.vendor }}_${{ matrix.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true